name: Build Multi-Platform Wheels

on:
  workflow_dispatch:  # Manual trigger
  release:
    types: [published]

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          # Reduce matrix size - build for latest Python on each OS
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Extract version from release tag (if release)
        if: github.event_name == 'release'
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update version in pyproject.toml (if release)
        if: github.event_name == 'release'
        run: |
          pip install tomli tomli-w
          python3 << EOF
          import tomllib
          import tomli_w
          version = "${{ steps.get_version.outputs.version }}"
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          data["project"]["version"] = version
          with open("pyproject.toml", "wb") as f:
              tomli_w.dump(data, f)
          print(f"✓ Updated version to {version}")
          EOF

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build Cython

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 30

