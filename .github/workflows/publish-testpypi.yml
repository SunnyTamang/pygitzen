name: Publish to TestPyPI

on:
  push:
    tags:
      - 'v*'  # Matches v0.2.0, v0.2.0rc1, v0.2.0-rc1, etc.
  workflow_dispatch:  # Manual trigger
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.3-rc1)'
        required: true
        type: string

jobs:
  build-and-publish:
    name: Build and Publish to TestPyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract version from tag or manual input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manual version: $VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Using tag version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Final version: $VERSION"

      - name: Update version in pyproject.toml and setup.py
        run: |
          pip install tomli tomli-w
          
          VERSION="${{ steps.get_version.outputs.version }}"
          
          python3 << EOF
          import tomllib
          import tomli_w
          import re
          
          version = "$VERSION"
          
          # Update pyproject.toml
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          
          data["project"]["version"] = version
          
          with open("pyproject.toml", "wb") as f:
              tomli_w.dump(data, f)
          
          print(f"✓ Updated pyproject.toml version to {version}")
          
          # Update setup.py
          with open("setup.py", "r") as f:
              setup_content = f.read()
          
          # Replace version in setup.py
          setup_content = re.sub(
              r'version="[^"]*"',
              f'version="{version}"',
              setup_content
          )
          
          with open("setup.py", "w") as f:
              f.write(setup_content)
          
          print(f"✓ Updated setup.py version to {version}")
          EOF

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build Cython

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: |
          echo "🔍 Verifying package metadata..."
          
          # Check if README_PYPI.md exists
          if [ ! -f "README_PYPI.md" ]; then
            echo "❌ README_PYPI.md not found!"
            exit 1
          fi
          
          echo "✅ README_PYPI.md found"
          
          # Check package metadata using twine
          pip install twine
          
          echo "📦 Checking package files with twine..."
          twine check dist/* || {
            echo "⚠️  Twine check found issues, but continuing..."
            echo "   (Some warnings may be non-fatal)"
          }
          
          # Verify version format and check if it already exists
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "📋 Version to publish: $VERSION"
          
          # Check if version already exists on TestPyPI
          echo "🔍 Checking if version already exists on TestPyPI..."
          RESPONSE=$(curl -s "https://test.pypi.org/pypi/pygitzen/$VERSION/json" 2>/dev/null || echo "{}")
          if echo "$RESPONSE" | grep -q '"version"'; then
            echo "⚠️  WARNING: Version $VERSION already exists on TestPyPI!"
            echo "   You may need to use a different version or delete the existing one."
            echo "   Continuing anyway (will fail if upload is rejected)..."
          else
            echo "✅ Version $VERSION is new (not found on TestPyPI)"
          fi
          
          # Verify version format in built files
          WHEEL_FILE=$(find dist -name "*.whl" | head -1)
          if [ -n "$WHEEL_FILE" ]; then
            echo "📦 Wheel: $WHEEL_FILE"
          fi
          
          SDIST_FILE=$(find dist -name "*.tar.gz" | head -1)
          if [ -n "$SDIST_FILE" ]; then
            echo "📦 Source: $SDIST_FILE"
          fi
          
          echo "✅ Metadata verification complete"

      - name: Verify Cython extension was built
        run: |
          echo "🔍 Checking if Cython extension was built..."
          
          # Check if wheel contains Cython extension
          WHEEL_FILE=$(find dist -name "*.whl" | head -1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "❌ No wheel file found!"
            exit 1
          fi
          
          echo "📦 Wheel file: $WHEEL_FILE"
          
          # Extract and check contents
          unzip -l "$WHEEL_FILE" | grep -E "(git_service_cython|\.so)" || echo "⚠️  No .so files found in wheel"
          
          # Check for .so files in wheel (platform-specific)
          if unzip -l "$WHEEL_FILE" | grep -q "\.so"; then
            echo "✅ Cython extension (.so) found in wheel!"
            unzip -l "$WHEEL_FILE" | grep "\.so"
          else
            echo "⚠️  Warning: No .so files found in wheel"
            echo "   This might be normal for source-only builds"
          fi
          
          # Check if .pyx file is in source distribution
          SDIST_FILE=$(find dist -name "*.tar.gz" | head -1)
          if [ -n "$SDIST_FILE" ]; then
            echo "📦 Source distribution: $SDIST_FILE"
            if tar -tzf "$SDIST_FILE" | grep -q "git_service_cython.pyx"; then
              echo "✅ Cython source (.pyx) found in source distribution!"
            else
              echo "❌ Cython source (.pyx) NOT found in source distribution!"
              exit 1
            fi
          fi
          
          echo "✅ Build verification complete!"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          verbose: true
          skip-existing: false
